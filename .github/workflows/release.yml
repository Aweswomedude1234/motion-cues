name: Release

# Push a tag like v1.0.1 (matching the VERSION file) to publish a release with the exe.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version" }

      - name: Test
        shell: pwsh
        run: ./test.ps1

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/SteadyCues.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SteadyCues.exe" | Set-Content -Encoding ascii dist/SteadyCues.exe.sha256
          Write-Host "SHA-256: $hash"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          # Use this version's changelog section as the release notes.
          $notes = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_.StartsWith("[$version]") } | Select-Object -First 1
          $body = "## Download`n`nDownload **SteadyCues.exe** below and open it. It installs itself for your account, with no admin rights needed.`n`nWindows may say the publisher is unknown: choose **More info** > **Run anyway**.`n`n## What's new`n" + ($notes -replace "^\[.*?\].*\r?\n", "")
          gh release create $env:GITHUB_REF_NAME dist/SteadyCues.exe dist/SteadyCues.exe.sha256 --title "SteadyCues $version" --notes "$body"
