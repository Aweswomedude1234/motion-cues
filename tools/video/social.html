<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SteadyCues social card</title>
<!-- Link-preview image (Open Graph / GitHub social preview). Rendered by render.mjs --social. -->
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Figtree, sans-serif; color: #161716; }
  .bg { position: absolute; inset: 0; background: url("https://images.unsplash.com/photo-1447871622716-5dc761437456?auto=format&fit=crop&w=1600&q=82") center 62% / cover; }
  .wash { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(244,245,242,.97) 0%, rgba(244,245,242,.9) 42%, rgba(244,245,242,.25) 68%, rgba(244,245,242,0) 100%); }
  .copy { position: absolute; left: 7%; top: 50%; transform: translateY(-50%); width: 56%; display: grid; gap: 22px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; }
  .brand img { width: 52px; border-radius: 24%; }
  h1 { margin: 0; font-size: 76px; line-height: .98; letter-spacing: -0.045em; font-weight: 700; }
  p { margin: 0; font-size: 27px; color: #3b3e39; font-weight: 500; }
  .pill { justify-self: start; background: #161716; color: #fff; font-weight: 700; font-size: 22px; padding: 12px 22px; border-radius: 999px; }
  .screen { position: absolute; right: 6%; top: 50%; transform: translateY(-50%); width: 30%; aspect-ratio: 3 / 3.7; border-radius: 22px;
    background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.65); backdrop-filter: blur(16px); box-shadow: 0 30px 70px -20px rgba(34,44,30,.55); overflow: hidden; }
  .page { position: absolute; left: 26%; right: 26%; top: 9%; bottom: -4%; background: #fff; border-radius: 12px 12px 0 0; padding: 18px 16px; }
  .page i { display: block; height: 8px; border-radius: 4px; background: #e6e8e3; margin-bottom: 11px; }
  .page i:first-child { height: 14px; width: 70%; background: #d6dad2; margin-bottom: 16px; }
  .dot { position: absolute; width: 16px; height: 16px; margin: -8px; border-radius: 50%; background: rgba(24,24,24,.88); border: 3px solid #fff; }
</style>
</head>
<body>
  <div class="bg"></div><div class="wash"></div>
  <div class="copy">
    <div class="brand"><img src="../../website/public/icon-128.png" alt="">SteadyCues</div>
    <h1>Read in the car without feeling sick.</h1>
    <p>Moving dots at the edges of your screen follow the road. Free and open source for Windows.</p>
    <div class="pill">steadycues.vercel.app</div>
  </div>
  <div class="screen" id="screen">
    <div class="page"><i></i><i></i><i style="width:85%"></i><i></i><i style="width:60%"></i><i></i><i style="width:80%"></i><i></i><i style="width:70%"></i></div>
  </div>
  <script>
    // Two columns of dots per side, nudged down and to the right as if the car is pulling away into a left bend.
    const s = document.getElementById('screen');
    for (const side of [0, 1]) for (const col of [0, 1]) for (let row = 0; row < 7; row++) {
      const d = document.createElement('span');
      d.className = 'dot';
      const x = side ? 100 - (7 + col * 11) : 7 + col * 11;
      d.style.left = `${x + 2.5}%`;
      d.style.top = `${9 + row * 13.5 + 3}%`;
      d.style.opacity = col ? .75 : 1;
      s.appendChild(d);
    }
    window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 0 : new Promise(r => i.onload = i.onerror = r)),
      new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'https://images.unsplash.com/photo-1447871622716-5dc761437456?auto=format&fit=crop&w=1600&q=82'; })]);
  </script>
</body>
</html>
